<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bank of India | Secure Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-login">
  <main class="login-shell">
    <div class="login-card">
      <!-- Branding Side -->
      <div class="login-branding">
        <div class="logo-container">
          <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGradientLogin" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#logoGradientLogin)" />
            <text x="50%" y="62%" text-anchor="middle" font-size="32" font-weight="800" fill="white" font-family="'Outfit', sans-serif">BOI</text>
          </svg>
        </div>
        <h1>Bank of India</h1>
        <p class="subtext">Secure Role-Based Access Control System</p>
      </div>

      <!-- Form Side -->
      <div class="login-form-side">
        <form id="loginForm" class="stack">
          <div class="input-group">
            <label for="username">User ID</label>
            <input type="text" id="username" placeholder="e.g. admin" required>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <button type="submit" id="loginBtn">Unlock Workspace</button>
        </form>
        
        <div id="loginMessage" class="message" style="margin-top: 16px;"></div>

        <div class="demo-box">
          <p><strong>Demo Credentials</strong></p>
          <div style="font-size: 14px; margin-top: 8px;">
            <p>admin / admin123</p>
            <p>manager / manager123</p>
            <p>viewer / viewer123</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
